<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VendorBridge - Login & Registration</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="auth-container">

        <!-- LOGIN SECTION -->
        <div class="auth-box" id="login-section">
            <h1 style="color: #3b82f6; margin-bottom: 5px;">VendorBridge</h1>
            <p style="margin-bottom: 25px; color: #ccc;">Procurement Management System</p>

            <div class="photo-circle">
                <img src="logo.png" alt="VendorBridge Logo" style="width:100%; height:100%; object-fit:cover;">
            </div>

            <div class="form-group" style="text-align:left; margin-bottom:0;">
                <input type="email" id="login-username" class="form-control" placeholder="Email Address" required style="margin-bottom:12px;">
                <input type="password" id="login-password" class="form-control" placeholder="Password" required style="margin-bottom:0;">
            </div>

            <button type="button" class="btn" onclick="handleLogin()"
                style="width:100%; justify-content:center; margin-top:18px; padding:14px;">
                Login
            </button>

            <p class="toggle-link" onclick="toggleAuth('register')">Don't have an account? Register here</p>
        </div>

        <!-- REGISTER SECTION -->
        <div class="auth-box" id="register-section" style="display: none; max-width: 620px;">
            <h1 style="color: #3b82f6; margin-bottom: 5px;">VendorBridge</h1>
            <p style="margin-bottom: 25px; color: #ccc;">Create Your Account</p>

            <div class="photo-circle">
                <img src="logo.png" alt="VendorBridge Logo" style="width:100%; height:100%; object-fit:cover;">
            </div>

            <div class="form-grid">
                <input type="text"  id="reg-firstname" placeholder="First Name"    required>
                <input type="text"  id="reg-lastname"  placeholder="Last Name"     required>
                <input type="email" id="reg-email"     placeholder="Email Address" required>
                <input type="tel"   id="reg-phone"     placeholder="Phone Number"  required>
                <select id="reg-role" required>
                    <option value="" disabled selected>Select Role</option>
                    <option value="Admin">Admin</option>
                    <option value="Procurement Officer">Procurement Officer</option>
                    <option value="Vendor">Vendor</option>
                </select>
                <input type="text" id="reg-country" placeholder="Country" required>
                <input type="password" id="reg-password" placeholder="Password" required>
                <input type="password" id="reg-confirm-password" placeholder="Confirm Password" required>
            </div>

            <textarea id="reg-additional" rows="3"
                placeholder="Additional Information (optional)"
                style="width:100%; padding:12px; margin:12px 0 0; border-radius:6px;
                       border:1px solid #333; background:#121212; color:white; resize:vertical; font-size:14px;">
            </textarea>

            <button type="button" class="btn" onclick="handleRegister()"
                style="width:100%; justify-content:center; margin-top:18px; padding:14px;">
                Create Account
            </button>

            <p class="toggle-link" onclick="toggleAuth('login')">Already have an account? Back to Login</p>
        </div>

    </div>
    <script src="app.js"></script>
</body>
</html>
