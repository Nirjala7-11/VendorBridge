<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VendorBridge - Login & Registration</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="auth-container">
        
        <div class="auth-box" id="login-section">
            <h1 style="color: #4caf50; margin-bottom: 5px;">VendorBridge</h1>
            <p style="margin-bottom: 25px; color: #ccc;">Login Screen</p>
            
            <div class="photo-circle">Photo</div>

            <form id="loginForm">
                <input type="text" id="login-username" placeholder="Username" required>
                <input type="password" id="login-password" placeholder="Password" required>
                <button type="button" class="btn" onclick="handleLogin()">Login Button</button>
            </form>
            
            <p class="toggle-link" onclick="toggleAuth('register')">Don't have an account? Register here</p>
        </div>

        <div class="auth-box" id="register-section" style="display: none; max-width: 600px;">
            <h1 style="color: #4caf50; margin-bottom: 5px;">VendorBridge</h1>
            <p style="margin-bottom: 25px; color: #ccc;">Registration Screen</p>
            
            <div class="photo-circle">Photo</div>

            <form id="registerForm">
                <div class="form-grid">
                    <input type="text" id="reg-firstname" placeholder="First Name" required>
                    <input type="text" id="reg-lastname" placeholder="Last Name" required>
                    
                    <input type="email" id="reg-email" placeholder="Email Address" required>
                    <input type="tel" id="reg-phone" placeholder="Phone Number" required>
                    
                    <select id="reg-role" required>
                        <option value="" disabled selected>Role (Admin, officer)</option>
                        <option value="Admin">Admin</option>
                        <option value="Procurement Officer">Procurement Officer</option>
                        <option value="Vendor">Vendor</option>
                    </select>
                    <input type="text" id="reg-country" placeholder="Country" required>
                </div>
                
                <textarea id="reg-additional" rows="4" placeholder="Additional Information ...." style="width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: 1px solid #333; background: #121212; color: white; resize: vertical;"></textarea>
                
                <button type="button" class="btn" onclick="handleRegister()">Register</button>
            </form>
            
            <p class="toggle-link" onclick="toggleAuth('login')">Already have an account? Back to Login</p>
        </div>

    </div>
    <script src="app.js"></script>
</body>
</html>
