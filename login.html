<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f3f4f6; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .login-container { background-color: #ffffff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); width: 100%; max-width: 400px; }
        h1 { text-align: center; margin-bottom: 24px; color: #111827; font-size: 28px; }
        .form-group { display: flex; flex-direction: column; width: 100%; margin-bottom: 15px; }
        label { font-size: 14px; font-weight: 600; margin-bottom: 6px; color: #4b5563; }
        input { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 15px; outline: none; transition: border-color 0.2s; }
        input:focus { border-color: #2563eb; }
        .btn-submit { width: 100%; padding: 12px; background-color: #2563eb; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; transition: background-color 0.2s; }
        .btn-submit:hover { background-color: #1d4ed8; }
        .btn-secondary { width: 100%; padding: 12px; background-color: transparent; color: #2563eb; border: 1px solid #2563eb; border-radius: 4px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; transition: all 0.2s; text-align: center; display: block; text-decoration: none; }
        .btn-secondary:hover { background-color: #eff6ff; }
        .divider { text-align: center; margin: 15px 0; color: #9ca3af; font-size: 14px; position: relative; }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Login</h1>
        <form action="#" method="POST">
            <div class="form-group">
                <input type="text" id="username" placeholder="Enter Username" required>
            </div>
            <div class="form-group">
                <input type="password" id="password" placeholder="Enter Password" required>
            </div>
            
            <button type="submit" class="btn-submit">Login</button>
            
            <div class="divider">or</div>
            
            <!-- Link to your registration page -->
            <a href="registration.html" class="btn-secondary">Sign Up</a>
        </form>
    </div>
</body>
</html>
