<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>
    <style>
        *{
          box-sizing:border-box; 
          margin:0; 
          padding:0; 
        }
        body{ 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f3f4f6; 
            color: #333; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px;
        }
        .reg-container { 
            background-color: #ffffff; 
            padding: 30px; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); 
            width: 100%; 
            max-width: 500px; 
        }
        h2 { 
            text-align: center; 
            margin-bottom: 24px; 
            color: #111827; 
        }
        .form-row { 
            display: flex; 
            gap: 15px; 
            margin-bottom: 15px; 
        }
        .form-group { display: flex; flex-direction: column; width: 100%; margin-bottom: 15px; }
        .form-row .form-group { margin-bottom: 0; }
        label { font-size: 14px; font-weight: 600; margin-bottom: 6px; color: #4b5563; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 15px; outline: none; transition: border-color 0.2s; }
        input:focus, select:focus, textarea:focus { border-color: #2563eb; }
        .phone-input-container { display: flex; gap: 8px; }
        .phone-input-container select { width: 35%; }
        .phone-input-container input { width: 65%; }
        textarea { resize: vertical; min-height: 80px; font-family: inherit; }
        .btn-submit { width: 100%; padding: 12px; background-color: #2563eb; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; transition: background-color 0.2s; }
        .btn-submit:hover { background-color: #1d4ed8; }
    </style>
</head>
<body>
    <div class="reg-conatiner">
        <form action="#" method="POST"></form>>
            <div class="form-row">
                <div class="form-group">
                    <input type="text" id="first-name" name="first-name" placeholder="First Name">
                </div>
                <div class="form-group">
                    <input type="text" id="last-name" name="last-name" placeholder="Last Name">
                </div>
            </div>

            <div class="form-group">
                <input type="email" id="email" name="email" placeholder="Email Address">
            </div>

            <div class="form-group">
                <div class="phone-input-container">
                    <select id="country-code" name="country-code">
                        <option value="+1">+1 (US/CA)</option>
                        <option value="+91" selected>+91 (IN)</option>
                        <option value="+44">+44 (UK)</option>
                        <option value="+61">+61 (AU)</option>
                        <option value="+81">+81 (JP)</option>
                    </select>
                    <input type="tel" id="phone" name="phone" placeholder="Phone Number">
                </div>
            </div>

            <div class="form-group">
                <select id="role" name="role" placeholder="Role">
                    <option value="Admin">Admin</option>
                    <option value="Officer">Officer</option>
                </select>
            </div>

            <div class="form-group">
                <select id="country" name="country" placeholder="Country">
                    <option value="Select" disabled selected>Select Country</option>
                    <option value="India">India</option>
                    <option value="USA">USA</option>
                    <option value="UK">UK</option>
                    <option value="Australia">Australia</option>
                    <option value="Japan">Japan</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <textarea id="additional-info" name="additional-info" placeholder="Additional Information..."></textarea>
            </div>

            <button type="submit">Sign Up</button>
        </form>
    </div>
</body>
</html>
